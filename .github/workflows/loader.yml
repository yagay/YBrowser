name: YBrowser one-APK LSPosed API102 debug
on:
  push:
    branches: [browser-loader-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ybrowser-loader-v1
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the single YBrowser application
        run: gradle --no-daemon --build-cache :app:assembleDebug
      - name: Verify only one APK and modern LSPosed metadata
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          test "$(find . -path '*/build/outputs/apk/*/*.apk' -type f | wc -l)" -eq 1
          for meta in META-INF/xposed/java_init.list META-INF/xposed/scope.list META-INF/xposed/module.prop; do
            unzip -Z1 "$apk" | grep -Fxq "$meta"
          done
          unzip -Z1 "$apk" | grep -Eq '^classes[0-9]*\.dex$'
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: YBrowser-AllInOne-ARM64-compatible-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
