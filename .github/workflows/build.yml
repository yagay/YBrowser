name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Run AI workspace unit tests
        run: gradle --no-daemon :ai-workspace:testDebugUnitTest
      - name: Build arm64-v8a debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare fixed APK name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*arm64-v8a-debug.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/YBrowser-debug-arm64-v8a.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YBrowser-debug-arm64-v8a
          path: artifacts/YBrowser-debug-arm64-v8a.apk
          if-no-files-found: error
