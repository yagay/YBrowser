name: YBrowser Candy ARM64 debug

on:
  push:
    branches: [browser-candy-rebuild]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candy-arm64-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout YBrowser Candy source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle from Candy wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Build full dual-engine arm64-v8a debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache --stacktrace \
            -Pcandy.releaseAbi=arm64-v8a \
            -Pcandy.debugApplicationIdSuffix=.ybrowser \
            '-Pcandy.debugAppLabel=YBrowser Candy' \
            :app:assembleFullDebug

      - name: Collect debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -print
          apk="$(find app/build/outputs/apk/full/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk" || { echo "Candy full arm64 debug APK not found"; exit 1; }
          cp "$apk" artifacts/YBrowser-Candy-arm64-debug.apk

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YBrowser-Candy-arm64-debug
          path: artifacts/YBrowser-Candy-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
