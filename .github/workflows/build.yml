name: YBrowser V2 ARM64 Debug
on:
  push:
    branches: [browser-v2-rebuild]
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit tests
        run: gradle --no-daemon :browser-core:testDebugUnitTest
      - name: Build arm64 debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*debug.apk' | head -n 1)"
          test -n "$apk"
          mkdir -p artifacts
          cp "$apk" artifacts/YBrowser-V2-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YBrowser-V2-arm64-debug
          path: artifacts/YBrowser-V2-arm64-debug.apk
          if-no-files-found: error
