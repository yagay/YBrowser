plugins {
    id 'com.android.application'
}
android {
    namespace 'com.yagay.ybrowser.loader'
    compileSdk 35
    defaultConfig {
        applicationId 'com.yagay.ybrowser.loader'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation project(':plugin-api')
    compileOnly 'io.github.libxposed:api:102.0.0'
}
