plugins {
    id 'com.android.application'
}
android {
    namespace 'com.yagay.ybrowser.sample'
    compileSdk 35
    defaultConfig {
        applicationId 'com.yagay.ybrowser.plugin.sample'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    compileOnly project(':plugin-api')
}
